<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1424" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Riot Control — hold the Capitol</title>
    <meta
      name="description"
      content="Riot Control: an isometric pixel-art horde tower-defense parody. Hold the Capitol in Madrid, London or Paris — every fallen officer makes the Ministry more legitimate."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Inline so the page is ink-dark before JS arrives, and the bundle ships no CSS file
         (a code-split CSS preload breaks hosts that only serve scripts). -->
    <style>
      /* Full-screen, no scroll / bounce / page zoom: the canvas owns every gesture. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        background: #1a1424;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        position: fixed;
        inset: 0;
        overflow: hidden;
        touch-action: none;
      }

      #game canvas {
        image-rendering: pixelated;
        touch-action: none;
      }

      .debug-overlay {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        margin: 0;
        padding: 6px 8px;
        font:
          12px/1.35 ui-monospace,
          'SFMono-Regular',
          Menlo,
          Consolas,
          monospace;
        color: #f3e8c8;
        background: rgba(26, 20, 36, 0.82);
        border: 1px solid #524b60;
        pointer-events: none;
        white-space: pre;
        z-index: 10;
      }

      .boot-error {
        position: fixed;
        inset: 16px;
        color: #f3e8c8;
        font:
          14px/1.4 ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Riot Control game canvas"></div>
    <noscript>Riot Control needs JavaScript.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
